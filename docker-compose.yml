services:
  shool-teacher:
    container_name: shool-teacher-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://school-api-production-a1c6.up.railway.app}
    image: shool-teacher:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3003}:8080"
    environment:
      - VITE_API_URL=${VITE_API_URL:-https://school-api-production-a1c6.up.railway.app}
    env_file:
      - path: .env
        required: false
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
